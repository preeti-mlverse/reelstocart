# Local dev + VPS deployment stack.
# Secrets come from an .env file alongside this compose (never committed).
name: reeltocart

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-reeltocart}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports: ["${MINIO_HOST_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  vision:
    build: { context: .., dockerfile: infra/Dockerfile.vision }
    environment:
      RTC_MODE: ${RTC_MODE:-DEVELOPMENT_MOCK}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: [db, redis]

  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment:
      RTC_MODE: ${RTC_MODE:-DEVELOPMENT_MOCK}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rtc}:${POSTGRES_PASSWORD:-rtc_dev_password}@db:5432/${POSTGRES_DB:-reeltocart}
      REDIS_URL: redis://redis:6379
      VISION_SERVICE_URL: http://vision:8000
    ports: ["3000:3000"]
    depends_on: [db, redis, vision]

volumes:
  pgdata:
  miniodata:
